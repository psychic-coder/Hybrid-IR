[project]
name = "hybridir"
version = "1.0.0"
description = "Hybrid retrieval engine (hand-built BM25 + HNSW + fusion + cross-encoder) with an evaluation harness"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# Pinned dependencies live in requirements-base.txt / requirements-ml.txt / requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = [
  "B008",   # FastAPI Depends()/Query() in defaults is idiomatic
  "RUF001", # ambiguous unicode in strings (we use '…' and Greek letters on purpose)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "BLE001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["app", "scripts"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
plugins = ["pydantic.mypy"]
