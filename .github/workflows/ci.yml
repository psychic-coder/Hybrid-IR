name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-base.txt
            backend/requirements-dev.txt
      # No torch / sentence-transformers: tests use offline fake models.
      - run: pip install -r requirements-base.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest
        run: python -m pytest -q
      - name: README renderer works with the standard library only
        run: |
          cp ../README.md "$RUNNER_TEMP/README.md"
          python3 -I scripts/render_readme.py --results-dir "$RUNNER_TEMP/no-results" --readme "$RUNNER_TEMP/README.md"
          grep -q 'Run `make eval` to populate' "$RUNNER_TEMP/README.md"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config is valid
        run: docker compose config -q && docker compose --profile loadtest config -q
